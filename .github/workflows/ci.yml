name: SecureFlow CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: "sqlite:///./secureflow_ci.db"
          JWT_SECRET_KEY: "test-only-secret-key-for-ci-not-for-production"
        run: python -m pytest tests/ -v

  dependency-audit:
    name: Audit Python Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit

      - name: Scan backend dependencies
        working-directory: backend
        run: pip-audit -r requirements.txt
    
  secret-scan:
    name: Scan Repository for Secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  
  container-scan:
    name: Scan Container Images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t secureflow-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t secureflow-frontend:ci ./frontend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: secureflow-backend:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: secureflow-frontend:ci
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Scan PostgreSQL image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: postgres:16
          scan-type: image
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'